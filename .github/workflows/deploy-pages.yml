name: Deploy Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5.0.0

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2.2.0

      - name: Render site
        uses: quarto-dev/quarto-actions/render@v2.2.0

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5.0.0

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4.0.0
        with:
          path: _site

  deploy:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url || steps.deploy_retry_1.outputs.page_url || steps.deploy_retry_2.outputs.page_url }}

    steps:
      - id: deploy
        name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v5.0.0
        continue-on-error: true

      - name: Wait before retrying deployment
        if: steps.deploy.outcome == 'failure'
        run: sleep 30

      - id: deploy_retry_1
        if: steps.deploy.outcome == 'failure'
        name: Retry GitHub Pages deployment
        uses: actions/deploy-pages@v5.0.0
        continue-on-error: true

      - name: Wait before final retry
        if: steps.deploy.outcome == 'failure' && steps.deploy_retry_1.outcome == 'failure'
        run: sleep 60

      - id: deploy_retry_2
        if: steps.deploy.outcome == 'failure' && steps.deploy_retry_1.outcome == 'failure'
        name: Final GitHub Pages deployment retry
        uses: actions/deploy-pages@v5.0.0
